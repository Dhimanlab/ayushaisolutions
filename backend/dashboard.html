<!-- START OF AI TOOL CODE -->
<div style="display: flex; height: 80vh; gap: 20px; font-family: 'Segoe UI', system-ui, sans-serif; color: #f8fafc; margin-top: 20px;">
    <!-- LEFT PANEL: FILE MANAGEMENT -->
    <div style="width: 50%; padding: 25px; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">
        <h3 style="margin-top:0; color:#38bdf8; font-size: 1.25rem;">📂 AI Document Space (Free Tier)</h3>
        
        <div id="dropZone" onclick="document.getElementById('pdfInput').click()" style="border: 2px dashed #38bdf8; border-radius: 8px; padding: 40px 20px; text-align: center; cursor: pointer; background: #0f172a; margin-bottom: 15px; color: #94a3b8; transition: 0.2s;">
            Click here to Upload a PDF File
            <input type="file" id="pdfInput" accept=".pdf" style="display:none">
        </div>
        
        <button onclick="goToStripe()" style="background: #e11d48; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; letter-spacing: 0.5px;">
            ⭐ Upgrade to Premium (Unlimited Access)
        </button>
        
        <h4 style="margin-bottom: 8px; margin-top: 20px; color:#94a3b8; font-weight: 500;">Document Summary</h4>
        <div id="summaryOutput" style="background: #0f172a; border-radius: 8px; padding: 20px; flex-grow: 1; overflow-y: auto; color: #cbd5e1; font-size: 14px; line-height: 1.6; white-space: pre-wrap;">
            Your automated AI document summary will generate here...
        </div>
    </div>

    <!-- RIGHT PANEL: INTERACTIVE CHAT -->
    <div style="width: 50%; padding: 25px; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">
        <h3 style="margin-top:0; color:#38bdf8; font-size: 1.25rem;">💬 Chat with Document</h3>
        <div id="chatBox" style="background: #0f172a; border-radius: 8px; padding: 20px; flex-grow: 1; overflow-y: auto; margin-bottom: 15px; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; gap: 12px;"></div>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="queryInput" placeholder="Ask a question about your file..." style="flex-grow: 1; padding: 14px; border: none; border-radius: 8px; background: #334155; color: white; font-size: 14px; outline: none;">
            <button onclick="askQuestion()" style="background: #0284c7; color: white; border: none; padding: 0 25px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px;">Send</button>
        </div>
    </div>
</div>

<script>
const pdfInput = document.getElementById('pdfInput');
const summaryOutput = document.getElementById('summaryOutput');
const chatBox = document.getElementById('chatBox');
const queryInput = document.getElementById('queryInput');

// Processing Uploaded Documents
pdfInput.addEventListener('change', async () => {
    if (!pdfInput.files || pdfInput.files.length === 0) return;
    const file = pdfInput.files[0];

    summaryOutput.innerText = "Extracting details and creating summary... Please wait.";
    
    const formData = new FormData();
    formData.append('pdf', file);

    try {
        const response = await fetch('/api/upload', { method: 'POST', body: formData });
        const result = await response.json();
        
        if (response.ok) {
            summaryOutput.innerText = result.summary;
        } else {
            summaryOutput.innerHTML = <span style="color:#ef4444; font-weight: bold;">⚠️ ${result.error}</span>;
        }
    } catch (err) {
        summaryOutput.innerHTML = <span style="color:#ef4444; font-weight: bold;">⚠️ Server communication error.</span>;
    }
});

// Interactive AI Engine Communication
async function askQuestion() {
    const question = queryInput.value.strip ? queryInput.value.strip() : queryInput.value;
    if (!question) return;

    chatBox.innerHTML += <div style="background: #334155; padding: 10px 14px; border-radius: 8px; align-self: flex-end; max-width: 80%;"><b>You:</b> ${question}</div>;
    queryInput.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question })
        });

        const result = await response.json();
        const displayAnswer = result.answer || result.error;
        chatBox.innerHTML += <div style="background: #0284c7; padding: 10px 14px; border-radius: 8px; align-self: flex-start; max-width: 80%;"><b>AI:</b> ${displayAnswer}</div>;
        chatBox.scrollTop = chatBox.scrollHeight;
    } catch (err) {
        chatBox.innerHTML += <div style="background: #991b1b; padding: 10px 14px; border-radius: 8px; align-self: flex-start;"><b>System Error:</b> Could not reach AI engine.</div>;
    }
}

// Redirect User to Payment Setup Screen
function goToStripe() {
    // Paste your Stripe payment link directly between the quotes below
    window.location.href = "https://stripe.com";
}

// Listen for enter key in the message input
queryInput.addEventListener("keyup", function(event) {
    if (event.key === "Enter") {
        askQuestion();
    }
});
</script>
<!-- END OF AI TOOL CODE -->
